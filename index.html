r;gap:20px}.vehiclehero h2{font:800 24px Manrope;margin:7px 0}.vehiclehero p{color:#a9b7c8;font-size:12px;margin:0}.vehiclehero .caricon{font-size:64px;opacity:.45}.progress{display:flex;gap:5px;margin:15px 0}.progress span{flex:1;height:8px;border-radius:9px;background:#e6ebf0}.progress span.done{background:var(--red)}.timeline{display:grid;gap:0}.step{display:flex;gap:15px;padding:0 0 21px}.step .circle{width:28px;height:28px;flex-shrink:0;border:2px solid #d8e0e8;border-radius:50%;display:grid;place-items:center;color:#9ba9b9;font-size:12px;font-weight:800}.step.done .circle{background:#e9f8f0;border-color:#b8e7d1;color:#11875c}.step.current .circle{background:#bd1836;border-color:#bd1836;color:white}.step strong{font-size:13px}.step small{display:block;color:#8b98a7;margin-top:5px}.customerhero{background:linear-gradient(115deg,#101b2b,#29384c);color:white;border-radius:16px;padding:36px;margin-bottom:20px}.customerhero h2{font:800 29px Manrope;margin:8px 0}.customerhero p{color:#b8c4d2;line-height:1.6}.toast{background:#eaf7f0;border:1px solid #bee9d2;color:#137a54;padding:13px;border-radius:10px;margin:12px 0;font-size:13px}.empty{padding:30px;text-align:center;color:#8390a1}.barrow{display:flex;align-items:center;gap:14px;margin:16px 0}.barrow .barname{width:140px;font-size:12px;color:#6b798b}.bar{height:10px;background:#eef1f5;border-radius:10px;flex:1;overflow:hidden}.bar>span{height:100%;background:#c51938;display:block;border-radius:10px}.barrow b{width:24px;text-align:right;font-size:12px}.mobiletop{display:none}@media(max-width:1100px){.sidebar{width:205px}.content{padding:25px}.top{padding:0 25px}.metrics{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}.sidebar{position:static;width:100%;height:auto;padding:10px}.brand,.navlabel,.sidefoot{display:none}.sidebar nav{display:flex;overflow-x:auto;gap:5px}.navbtn{white-space:nowrap;width:auto;font-size:11px;padding:12px}.navbtn .ico{display:no </style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="kia">KИ</div><small>ATL AUTOMOTIVE · KIA CARE</small></div><div class="navlabel">WORKSPACE</div><nav id="nav"></nav><div class="sidefoot"><strong>ATL Automotive</strong><br>Kingston Service Centre<br><span style="color:#60caa5">●</span> Demo environment</div></aside><div class="main"><header class="top"><div class="crumb">ATL Automotive <span style="padding:0 9px">/</span> <strong id="crumb">Overview</strong></div><div class="topright"><span class="live">● SYSTEM DEMO</span><span class="person">Service Concierge</span><span class="avatar">SC</span></div></header><main class="content" id="app"></main></div></div><script>
'use strict';
const stages=['Waiting','Checked In','In Service','Quality Check','Ready for Pickup','Completed'];
const seed=[{id:'KC-1001',name:'John Brown',plate:'1234 KJ',model:'2023 Kia Sportage',appointment:'09:00',arrival:'08:55',service:'Scheduled Maintenance',advisor:'Michael Green',status:'In Service',notes:'Oil change and multi-point inspection underway',technician:'D. Williams'},{id:'KC-1002',name:'Sarah James',plate:'4566 KJ',model:'2024 Kia Seltos',appointment:'08:00',arrival:'07:55',service:'Oil Change',advisor:'Andre Wilson',status:'Ready for Pickup',notes:'Service completed. Vehicle ready for collection.',technician:'K. Thomas'},{id:'KC-1003',name:'David Clarke',plate:'1122 KJ',model:'2022 Kia Sorento',appointment:'09:30',arrival:'09:10',service:'Brake Inspection',advisor:'Michael Green',status:'Checked In',notes:'Customer reports brake noise',technician:'Unassigned'},{id:'KC-1004',name:'Alicia Grant',plate:'3344 KJ',model:'2021 Kia Rio',appointment:'10:00',arrival:'09:25',service:'General Service',advisor:'Andre Wilson',status:'Waiting',notes:'',technician:'Unassigned'},{id:'KC-1005',name:'Kevin Morris',plate:'9988 KJ',model:'2023 Kia Picanto',appointment:'Walk-in',arrival:'08:45',service:'Diagnostic',advisor:'Unassigned',status:'Waiting',notes:'Check engine light illuminated',technician:'Unassigned'}];
let records;try{records=JSON.parse(localStorage.getItem('atl_kia_premium_v1'))||structuredClone(seed)}catch(e){records=JSON.parse(JSON.stringify(seed))}
let page='Overview',selected=records[0].id,filter='All',sort='appointment',search='',lookup='1234 KJ',notice='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('atl_kia_premium_v1',JSON.stringify(records))}catch(e){}};const status=s=>'<span class="status s-'+s.replaceAll(' ','-')+'">'+esc(s)+'</span>';const options=(arr,val)=>arr.map(x=>'<option value="'+esc(x)+'" '+(x===val?'selected':'')+'>'+esc(x)+'</option>').join('');const panel=x=>'<section class="panel">'+x+'</section>';const field=(label,input,extra='')=>'<div class="field '+extra+'"><label>'+label+'</label>'+input+'</div>';const heading=(ey,title,sub)=>'<div class="eyebrow">'+ey+'</div><h1 class="title">'+title+'</h1><p class="sub">'+sub+'</p>';const min=t=>t==='Walk-in'?9999:Number(t.split(':')[0])*60+Number(t.split(':')[1]);const get=()=>records.find(r=>r.id===selected)||records[0];
function go(p){page=p;notice='';render();window.scrollTo(0,0)}function edit(id,key,value){const r=records.find(x=>x.id===id);if(!r)return;r[key]=value;save();render()}function openJob(id){selected=id;go('Service Orders')}function trackJob(id){const r=records.find(x=>x.id===id);lookup=r.plate;go('Customer Portal')}function reset(){if(confirm('Restore original sample vehicles?')){records=JSON.parse(JSON.stringify(seed));save();selected=records[0].id;go('Overview')}}
function render(){const pages=[['Overview','◫'],['Service Queue','☷'],['Vehicle Check-in','⊕'],['Service Orders','⚙'],['Customer Portal','◎'],['Analytics','▥']];$('nav').innerHTML=pages.map(([p,ico])=>'<button class="navbtn '+(page===p?'active':'')+'" data-page="'+p+'"><span class="ico">'+ico+'</span>'+p+'</button>').join('');$('nav').querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));$('crumb').textContent=page;let h='';
if(page==='Overview'){h=heading('SERVICE COMMAND CENTRE','Good morning, Service Team','A complete view of your workshop operations and customer service journey.')+'<div class="headingrow" style="margin-top:-13px;margin-bottom:20px"><span class="muted tiny">DEMONSTRATION DATA · TODAY</span><button class="btn" id="newBtn">＋ &nbsp; New Check-in</button></div><div class="metrics">'+[['Vehicles checked in',records.length,'▤','Across all service stages'],['Awaiting service',records.filter(r=>['Waiting','Checked In'].includes(r.status)).length,'◷','Waiting for workshop allocation'],['In workshop',records.filter(r=>['In Service','Quality Check'].includes(r.status)).length,'⚙','Currently being serviced'],['Ready for pickup',records.filter(r=>r.status==='Ready for Pickup').length,'✓','Customer collection pending']].map(([l,v,i,sub])=>'<div class="metric"><div class="mhead">'+l+'<span class="micon">'+i+'</span></div><div class="value">'+v+'</div><div class="hint">'+sub+'</div></div>').join('')+'</div><div class="split"><div>'+panel('<div class="panelhead"><h2>Today’s service activity</h2><button class="link" id="viewQueue">View all →</button></div>'+table(records.slice(0,5)))+'</div><div>'+panel('<div class="panelhead"><h2>Quick actions</h2></div><div class="quick"><button data-go="Vehicle Check-in"><span>⊕</span>Check in<small>Log a new arrival</small></button><button data-go="Service Queue"><span>☷</span>Manage queue<small>Review priorities</small></button><button data-go="Service Orders"><span>⚙</span>Update jobs<small>Advance progress</small></button><button data-go="Customer Portal"><span>◎</span>Customer view<small>Track a vehicle</small></button></div>')+panel('<div class="panelhead"><h2>Workshop pipeline</h2></div>'+stages.map(s=>'<div class="stageitem"><span class="dot"></span><span class="tiny">'+s+'</span><span class="count">'+records.filter(r=>r.status===s).length+'</span></div>').join(''))+'</div></div>'}
if(page==='Service Queue'){const q=records.filter(r=>(filter==='All'||r.status===filter)&&(!search||[r.name,r.plate,r.model,r.id].some(v=>v.toLowerCase().includes(search.toLowerCase())))).slice().sort((a,b)=>sort==='arrival'?min(a.arrival)-min(b.arrival):min(a.appointment)-min(b.appointment)||min(a.arrival)-min(b.arrival));h=heading('WORKSHOP OPERATIONS','Live Service Queue','Prioritize scheduled appointments and manage customer arrivals with confidence.')+'<div class="headingrow" style="margin-bottom:18px"><span class="muted tiny">'+q.length+' VEHICLES SHOWN</span><button class="btn" data-go="Vehicle Check-in">＋ Add vehicle</button></div>'+panel('<div class="filters">'+field('Search vehicle','<input id="search" class="input" placeholder="Name, plate or job ID" value="'+esc(search)+'">','')+field('Sort queue','<select id="sort">'+options(['appointment','arrival'],sort)+'</select>')+field('Service stage','<select id="filter">'+options(['All',...stages],filter)+'</select>')+'</div>'+table(q,true)+'<p class="muted tiny">Appointment mode prioritizes scheduled customers; walk-ins follow. Arrival mode displays physical check-in order.</p>')}
if(page==='Vehicle Check-in'){h=heading('FRONT DESK','Vehicle Arrival & Check-in','Capture the customer’s arrival and immediately place their vehicle into the service queue.')+panel('<form id="checkin" class="formgrid">'+field('Customer full name *','<input class="input" name="name" placeholder="e.g. John Brown" required>')+field('Vehicle registration *','<input class="input" name="plate" placeholder="e.g. 1234 KJ" required>')+field('Kia vehicle model','<select name="model">'+options(['Kia Sportage','Kia Seltos','Kia Sorento','Kia Sonet','Kia Picanto','Kia Rio','Kia EV6'],'Kia Sportage')+'</select>')+field('Service type','<select name="service">'+options(['Scheduled Maintenance','Oil Change','Brake Inspection','General Service','Diagnostic','Warranty Inspection'],'Scheduled Maintenance')+'</select>')+field('Booking type','<select id="type" name="type"><option>Appointment</option><option>Walk-in</option></select>')+field('Appointment time','<input class="input" id="appointment" name="appointment" type="time" value="10:30">')+field('Actual arrival time','<input class="input" name="arrival" type="time" value="10:15" required>')+field('Service advisor','<select name="advisor">'+options(['Unassigned','Michael Green','Andre Wilson'],'Unassigned')+'</select>')+field('Customer concerns / inspection notes','<textarea name="notes" rows="4" placeholder="Document reported issues, inspection notes or customer requests"></textarea>','full')+'<div class="full"><button class="btn" type="submit">✓ &nbsp; Check in vehicle & create service order</button></div></form>')}
if(page==='Service Orders'){const r=get();h=heading('WORKSHOP MANAGEMENT','Service Order Details','Assign staff, manage servicing stages and keep the customer informed.')+field('Select vehicle / job','<select id="jobSelect">'+records.map(x=>'<option value="'+x.id+'" '+(x.id===r.id?'selected':'')+'>'+esc(x.id+' · '+x.plate+' · '+x.name)+'</option>').join('')+'</select>')+'<div style="height:18px"></div><div class="vehiclehero"><div><div class="eyebrow" style="color:#f6a2b2">'+r.id+'</div><h2>'+esc(r.model)+'</h2><p>'+esc(r.name)+' · '+esc(r.plate)+'</p><p style="margin-top:11px">'+esc(r.service)+'</p></div><div class="caricon">▰</div></div><div style="height:20px"></div><div class="split"><div>'+panel('<div class="panelhead"><h2>Service workflow</h2>'+status(r.status)+'</div><div class="timeline">'+stages.map((s,i)=>'<div class="step '+(i<stages.indexOf(r.status)?'done':i===stages.indexOf(r.status)?'current':'')+'"><span class="circle">'+(i<stages.indexOf(r.status)?'✓':i+1)+'</span><div><strong>'+s+'</strong><small>'+(i<stages.indexOf(r.status)?'Stage completed':i===stages.indexOf(r.status)?'Current stage':'Upcoming')+'</small></div></div>').join('')+'</div><button class="btn" id="advance" '+(r.status==='Completed'?'disabled':'')+'>Advance to next stage →</button>')+'</div><div>'+panel('<div class="panelhead"><h2>Job controls</h2></div>'+field('Service status','<select id="stageSelect">'+options(stages,r.status)+'</select>')+'<div style="height:15px"></div>'+field('Service advisor','<select id="advisorSelect">'+options(['Unassigned','Michael Green','Andre Wilson'],r.advisor)+'</select>')+'<div style="height:15px"></div>'+field('Assigned technician','<select id="techSelect">'+options(['Unassigned','D. Williams','K. Thomas','S. Campbell'],r.technician||'Unassigned')+'</select>')+'<div style="height:15px"></div>'+field('Workshop notes','<textarea id="notes" rows="4">'+esc(r.notes)+'</textarea>')+'<div style="height:15px"></div><button class="btn" id="saveNotes">Save notes</button><button class="btn outline" style="margin-top:9px" id="customerView">View customer tracking ↗</button>')+'</div></div>'}
if(page==='Customer Portal'){const r=records.find(x=>x.plate.toLowerCase()===lookup.trim().toLowerCase()||x.id.toLowerCase()===lookup.trim().toLowerCase());h='<div class="customerhero"><div class="eyebrow" style="color:#ff9eae">WELCOME TO KIA CARE</div><h2>Your Kia. Our priority.</h2><p>Stay connected to your service experience, from check-in to collection.</p></div>'+panel('<div class="panelhead"><h2>Track your service</h2><span class="muted tiny">DEMO LOOKUP</span></div><div class="filters">'+field('Vehicle plate or job reference','<input class="input" id="lookup" value="'+esc(lookup)+'" placeholder="e.g. 1234 KJ">')+'<button class="btn" id="track">Track vehicle →</button></div><p class="muted tiny">Try 1234 KJ, 4566 KJ or any registration in the service queue.</p>')+(r?panel('<div class="headingrow"><div><div class="eyebrow">SERVICE REFERENCE '+esc(r.id)+'</div><h2 style="font:800 23px Manrope;margin:8px 0">'+esc(r.model)+'</h2><p class="muted tiny">'+esc(r.plate)+' · '+esc(r.service)+'</p></div>'+status(r.status)+'</div><div class="progress">'+stages.map((s,i)=>'<span class="'+(i<=stages.indexOf(r.status)?'done':'')+'"></span>').join('')+'</div><p class="muted tiny">Stage '+(stages.indexOf(r.status)+1)+' of '+stages.length+' · '+r.status+'</p><div class="timeline" style="margin-top:25px">'+stages.map((s,i)=>'<div class="step '+(i<stages.indexOf(r.status)?'done':i===stages.indexOf(r.status)?'current':'')+'"><span class="circle">'+(i<stages.indexOf(r.status)?'✓':i+1)+'</span><div><strong>'+s+'</strong><small>'+(i===stages.indexOf(r.status)?'Your vehicle is currently at this stage':i<stages.indexOf(r.status)?'Completed':'Pending')+'</small></div></div>').join('')+'</div><div style="padding:17px;background:#f7f9fb;border-radius:11px"><strong style="font-size:13px">Latest service update</strong><p class="muted" style="font-size:12px">'+esc(r.notes||'Awaiting a workshop update')+'</p><p class="muted tiny">Service advisor: '+esc(r.advisor)+'</p></div>'):panel('<div class="empty">No vehicle found. Enter a registration from the demo service queue.</div>'))+'<p class="muted tiny">Production access must verify customer identity. This public demo uses fictional data only.</p>'}
if(page==='Analytics'){h=heading('MANAGEMENT INSIGHTS','Service Performance','Monitor appointment volume, workshop stages and service throughput.')+'<div class="metrics">'+[['Total bookings',records.length],['Appointments',records.filter(r=>r.appointment!=='Walk-in').length],['Walk-ins',records.filter(r=>r.appointment==='Walk-in').length],['Completed jobs',records.filter(r=>r.status==='Completed').length]].map(([l,v])=>'<div class="metric"><div class="mhead">'+l+'</div><div class="value">'+v+'</div></div>').join('')+'</div>'+panel('<div class="panelhead"><h2>Vehicles by service stage</h2></div>'+stages.map(s=>'<div class="barrow"><span class="barname">'+s+'</span><div class="bar"><span style="width:'+(records.length?records.filter(r=>r.status===s).length/records.length*100:0)+'%"></span></div><b>'+records.filter(r=>r.status===s).length+'</b></div>').join(''))+'<button class="btn outline" id="reset">Reset demo records</button><p class="muted tiny">Real-time turnaround metrics require event timestamp capture and a connected database.</p>'}
$('app').innerHTML=h;if(notice){$('app').insertAdjacentHTML('afterbegin','<div class="toast">'+esc(notice)+'</div>');notice=''}bind()}
function table(data,numbered=false){return '<div class="tablewrap"><table><thead><tr>'+(numbered?'<th>#</th>':'')+'<th>Customer / Vehicle</th><th>Appointment</th><th>Arrival</th><th>Status</th><th>Action</th></tr></thead><tbody>'+data.map((r,i)=>'<tr>'+(numbered?'<td>'+(i+1)+'</td>':'')+'<td><strong>'+esc(r.name)+'</strong><small>'+esc(r.model)+' · '+esc(r.plate)+'</small></td><td>'+esc(r.appointment)+'</td><td>'+esc(r.arrival)+'</td><td>'+status(r.status)+'</td><td><button class="link" data-job="'+r.id+'">Manage →</button></td></tr>').join('')+'</tbody></table></div>'}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>openJob(b.dataset.job));if($('newBtn'))$('newBtn').onclick=()=>go('Vehicle Check-in');if($('viewQueue'))$('viewQueue').onclick=()=>go('Service Queue');if($('search'))$('search').oninput=e=>{search=e.target.value;const a=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(a,a)};if($('sort'))$('sort').onchange=e=>{sort=e.target.value;render()};if($('filter'))$('filter').onchange=e=>{filter=e.target.value;render()};if($('type'))$('type').onchange=e=>{$('appointment').disabled=e.target.value==='Walk-in'};if($('checkin'))$('checkin').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),id='KC-'+String(1001+records.length);records.push({id,name:String(f.get('name')).trim(),plate:String(f.get('plate')).trim().toUpperCase(),model:f.get('model'),service:f.get('service'),appointment:f.get('type')==='Walk-in'?'Walk-in':f.get('appointment'),arrival:f.get('arrival'),advisor:f.get('advisor'),status:'Checked In',notes:f.get('notes'),technician:'Unassigned'});save();selected=id;go('Service Orders');notice='Vehicle checked in successfully and added to the queue.';render()};if($('jobSelect'))$('jobSelect').onchange=e=>{selected=e.target.value;render()};if($('stageSelect'))$('stageSelect').onchange=e=>edit(selected,'status',e.target.value);if($('advisorSelect'))$('advisorSelect').onchange=e=>edit(selected,'advisor',e.target.value);if($('techSelect'))$('techSelect').onchange=e=>edit(selected,'technician',e.target.value);if($('advance'))$('advance').onclick=()=>{const r=get();edit(r.id,'status',stages[Math.min(stages.length-1,stages.indexOf(r.status)+1)])};if($('saveNotes'))$('saveNotes').onclick=()=>{edit(selected,'notes',$('notes').value);notice='Workshop notes saved.';render()};if($('customerView'))$('customerView').onclick=()=>trackJob(selected);if($('track'))$('track').onclick=()=>{lookup=$('lookup').value;render()};if($('lookup'))$('lookup').onkeydown=e=>{if(e.key==='Enter'){lookup=e.target.value;render()}};if($('reset'))$('reset').onclick=reset}
render();
</script></body></html>
